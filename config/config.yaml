logger:
  level: debug
  output_paths:
    - stdout

discord:
  guild_id: "836026401823260733"
  listen_channel: "1326784974602637413"

raiderio:
  base_url: https://raider.io
  user_agent: celestial-orrey/1.0
  poll_interval: 1m
  max_concurrent: 10

store:
  path: data/celestial_orrey.db
  backup_dir: data/backup

simc:
  binary_path: /usr/local/bin/simc
  work_dir: /app/data/simc
  threads: 4
  default_iterations: 10000
  max_iterations: 50000
  job_timeout: 30m
  max_queue_depth: 4
  report_retention: 24h
  history_size: 20
  stats_http_addr: 127.0.0.1:9090
  max_profile_bytes: 1048576
  sample_interval: 2s
  cgroup_root: /sys/fs/cgroup

simc_run:
  rank_pass_iterations: 1000
  final_pass_iterations: 10000
  progress_every: 50
  progress_min_interval: 2m
  history_size: 5
